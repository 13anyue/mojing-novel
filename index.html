<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#171827">
  <title>墨境 AI 视觉小说平台</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <button class="icon-btn" id="menuBtn">☰</button>
  <div><b>墨境</b><span class="muted"> AI Visual Novel Studio</span></div>
  <button class="primary small" id="previewBtn">▶ 预览</button>
</header>

<aside id="sidebar" class="sidebar">
  <button data-page="home">⌂ 首页</button>
  <button data-page="novel">▣ 文游编辑器</button>
  <button data-page="map">⌖ 独立地图</button>
  <button data-page="npc">♙ NPC 资料册</button>
  <button data-page="background">▧ 背景库</button>
  <button data-page="audio">♫ BGM 音频库</button>
  <button data-page="status">▤ HTML 状态栏</button>
  <button data-page="memory">◈ AI 记忆 / 召回</button>
  <button data-page="prompt">✦ 提示词 / 预设</button>
  <button data-page="regex">⌁ 正则规则</button>
  <button data-page="api">⚙ API 设置</button>
  <button data-page="settings">⚑ 项目设置</button>
</aside>

<main id="app"></main>
<div id="toast" class="toast"></div>
<script src="js/storage.js"></script>
<script src="js/app.js"></script>
</body>
</html>
